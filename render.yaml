services:
  - type: web
    name: envelope-rental
    runtime: node
    buildCommand: npm install && rm -rf client/envelope-client/build && npm run build
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: CLIENT_URL
        sync: false
